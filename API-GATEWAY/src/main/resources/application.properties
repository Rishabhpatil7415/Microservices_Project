spring.application.name=API-GATEWAY
server.port=9090

# --- Route 1: EMPLOYEE ---
spring.cloud.gateway.routes[0].id=EMPLOYEE
spring.cloud.gateway.routes[0].uri=lb://EMPLOYEE
spring.cloud.gateway.routes[0].predicates[0]=Path=/employees/**

# --- Route 2: ADDRESS ---
spring.cloud.gateway.routes[1].id=ADDRESS
spring.cloud.gateway.routes[1].uri=lb://ADDRESS
spring.cloud.gateway.routes[1].predicates[0]=Path=/addresses/**

# --- Route 3: AUTH ---
spring.cloud.gateway.routes[2].id=AUTH
spring.cloud.gateway.routes[2].uri=lb://AUTH
spring.cloud.gateway.routes[2].predicates[0]=Path=/auth/**